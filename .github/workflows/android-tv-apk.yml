name: Gerar APK da TV

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Endereço publicado do app (ex: https://meuapp.lovable.app)"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ github.event.inputs.app_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Usar assinatura fixa
        run: mkdir -p ~/.android && cp native/signing/debug.keystore ~/.android/debug.keystore
      - run: bun install
      - run: rm -rf android && bunx cap add android
      - name: Native launcher code
        run: |
          DIR=android/app/src/main/java/com/mikhaell/tvlauncher
          mkdir -p $DIR
          cp native/TvLauncherPlugin.java native/MainActivity.java native/RemapService.java native/RemoteServer.java native/RemoteService.java $DIR/
          mkdir -p android/app/src/main/res/xml android/app/src/main/assets
          cp native/remap_service.xml android/app/src/main/res/xml/
          cp native/remote.html android/app/src/main/assets/
          sed -i 's#</resources>#    <string name="remap_description">Permite trocar a função de um botão do controle remoto (ex: Globoplay) para abrir o YouCine. Não lê nada do que aparece na tela.</string>\n</resources>#' android/app/src/main/res/values/strings.xml
          python3 native/patch_manifest.py android/app/src/main/AndroidManifest.xml
      - run: bunx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tv-home-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
