name: Gerar APK do Controle (celular)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Usar assinatura fixa
        run: mkdir -p ~/.android && cp native/signing/debug.keystore ~/.android/debug.keystore
      - run: bun install
      - name: Montar app do celular
        run: |
          mkdir -p phone/www
          cp native/remote.html phone/www/index.html
          cd phone
          rm -rf android
          bunx cap add android
          bunx cap sync android
      - run: cd phone/android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tv-remote-apk
          path: phone/android/app/build/outputs/apk/debug/app-debug.apk
